name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    name: database and logic tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared logic tests
        run: npm run test:logic
      - name: Database rules and security tests
        run: bash supabase/tests/run.sh
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres

  web:
    name: website build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to commit package-lock.json the first time
    env:
      # Dummy values: the build never contacts Supabase, but the code refuses to start without them.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
            echo "NEW_LOCKFILE=1" >> "$GITHUB_ENV"
          fi
      - name: Build (includes type check)
        run: npm run build
      - name: Type check everything, tests included
        run: npm run typecheck
      - name: Commit the lockfile (first run only)
        if: env.NEW_LOCKFILE == '1' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add package-lock.json generated by CI"
          git push
