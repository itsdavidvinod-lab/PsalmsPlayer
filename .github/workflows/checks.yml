name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    name: database and logic tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared logic tests
        run: npm run test:logic
      - name: Database rules and security tests
        run: bash supabase/tests/run.sh
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres

  supabase:
    name: real Supabase stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (applies the four migrations, then seed.sql)
        run: bash .github/scripts/start-supabase.sh
      - name: Security tests against the real stack
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/tests/security.test.sql
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  web:
    name: website build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to commit package-lock.json the first time
    env:
      # Dummy values: the build never contacts Supabase, but the code refuses to start without them.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build (includes type check)
        run: npm run build
      - name: Type check everything, tests included
        run: npm run typecheck
      - name: Commit package-lock.json if dependencies changed
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update package-lock.json generated by CI"
            git push
          fi

  e2e:
    name: end-to-end on real Supabase
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (migrations and seed applied)
        run: bash .github/scripts/start-supabase.sh
      - name: Point the site at the local stack
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}" >> "$GITHUB_ENV"
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser and API tests
        run: npx playwright test
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
