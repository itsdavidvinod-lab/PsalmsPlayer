name: android

# Builds the Android app. The app is a thin native shell (Capacitor) around https://psalmsplayer.com, so this workflow only has to run
# when the shell itself changes; website changes reach the app without a new build. See docs/ANDROID.md.

on:
  push:
    branches: [main, android-app]
    paths:
      - 'capacitor.config.ts'
      - 'native-shell/**'
      - 'native/**'
      - 'scripts/android/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Android app (debug APK, and the signed Play bundle when the keystore secret exists)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # publishes the debug APK as a release, so it can be opened and installed from a phone
    env:
      # Secrets cannot be tested in an `if` directly; this copy can.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # Empty until the secrets are added. Gradle signs only when ANDROID_KEYSTORE_FILE is set (see the step below).
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Play accepts an upload only with a higher versionCode than every earlier one; the run number only ever goes up.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install
      # With the key, the test APK and the Play bundle are signed with the same key, so a new test build installs over the last one.
      # Without it (before the secrets exist) the test APK gets a fresh debug key every run: uninstall the old one first.
      - name: Put the signing key in place (when the secrets exist)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Create the Android project (Capacitor)
        run: npx cap add android
      - name: Make it PsalmsPlayer (icons, theme, sign-in return address, version, signing)
        run: node scripts/android/prepare.mjs
      - name: Sync the web shell into the project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Check what the APK contains
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" > badging.txt
          grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label:)" badging.txt
          grep -q "package: name='com.psalmsplayer.app'" badging.txt
          grep -q "targetSdkVersion:'36'" badging.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          grep -q "com.psalmsplayer.app" manifest.txt
          grep -q "auth-callback" manifest.txt
          unzip -p "$APK" assets/capacitor.config.json | tee capacitor.config.json.txt
          grep -q "https://psalmsplayer.com" capacitor.config.json.txt
          grep -q "PsalmsPlayerApp" capacitor.config.json.txt
          unzip -l "$APK" > apk-files.txt
          grep -q "assets/public/offline.html" apk-files.txt
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" > signer.txt
          echo "::notice title=test APK signing certificate (equals the upload key when the secrets exist)::$(grep -m1 'SHA-256' signer.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: psalmsplayer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # The repository is public, so this link works in the phone's browser without any sign-in:
      # https://github.com/${{ github.repository }}/releases/download/android-debug/PsalmsPlayer-debug.apk
      # It is a test build (debug-signed). It only opens the website, which still needs a Google sign-in.
      - name: Publish the debug APK as a release (one rolling release, replaced every build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk PsalmsPlayer-debug.apk
          gh release delete android-debug --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create android-debug PsalmsPlayer-debug.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "PsalmsPlayer Android test build" \
            --notes "Test build ${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Install by opening this page on an Android phone and tapping PsalmsPlayer-debug.apk. It is a debug build for testing, not the Play Store app."

      - name: Build the signed release bundle for Google Play
        if: env.KEYSTORE_B64 != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew bundleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" > verify.txt
          head -3 verify.txt
          # The fingerprint of the upload key, to compare with the one shown in Play Console.
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256"
          echo "::notice title=upload key SHA-256 of the signed bundle::$(keytool -printcert -jarfile "$AAB" | grep SHA256)"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        with:
          name: psalmsplayer-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove the signing key from the runner
        if: always() && env.ANDROID_KEYSTORE_FILE != ''
        run: rm -f "$ANDROID_KEYSTORE_FILE"
